name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.2.0 pyyaml==6.0.2
      # The Wazuh ruleset must be regenerable from the Sigma rules, and the
      # detection content (Sigma, Wazuh, Athena, registry) must all agree.
      - run: python convert/sigma_to_wazuh.py --check
      - run: python -m pytest tests/ -q
