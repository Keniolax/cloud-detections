title: Bulk Retrieval of Secrets Manager Secrets
id: a1f1e2b0-66aa-4b66-9c06-smbatchget
status: experimental
description: >
  An attacker pulled many Secrets Manager secrets at once with the batch API,
  harvesting credentials from the account's secret store (credential access).
  Emulated by Stratus Red Team
  aws.credential-access.secretsmanager-batch-retrieve-secrets.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.credential-access.secretsmanager-batch-retrieve-secrets/
author: seceng-bootcamp (week 11)
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: secretsmanager.amazonaws.com
    eventName: BatchGetSecretValue
  condition: selection
falsepositives:
  - An application that legitimately reads many secrets in one call.
level: medium
tags:
  - attack.credential-access
  - attack.t1555.006
wazuh:
  id: 100705
  level: 10
